name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-dict.mjs
      - run: git diff --exit-code dict/ru.txt dict/uk.txt || (echo "Пересоберите словари: node tools/build-dict.mjs" && exit 1)
      - run: node tools/test-generator.mjs 20
